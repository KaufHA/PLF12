substitutions:
  component_family: stock
  component_source: release
  profile: minimal
  target: plf12

packages:
  Kauf.PLF12: github://KaufHA/kauf-plugs/packages/kauf-plug.yaml

# stock family pulls in zero Kauf custom components; import just kauf_deprecations
# so the legacy-yaml warning below can still be emitted.
external_components:
  - source:
      type: git
      url: https://github.com/KaufHA/common
      ref: $sub_common_ref
    components: [kauf_deprecations]
    refresh: never

kauf_deprecations:
  yaml_file: "__KAUF_PLF12_MINIMAL_LEGACY_YAML__"
